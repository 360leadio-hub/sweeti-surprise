<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Sweeti 💙</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1a1a40,#243b55);
    overflow:hidden;
    color:white;
}

.stars{
    position:absolute;
    width:100%;
    height:100%;
    background-image:radial-gradient(white 1px,transparent 1px);
    background-size:40px 40px;
    opacity:.25;
}

.container{
    position:relative;
    width:90%;
    max-width:420px;
    padding:30px;
    text-align:center;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(15px);
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{
    margin-bottom:15px;
}

p{
    line-height:1.8;
    font-size:17px;
}

button{
    margin:20px 8px 0;
    padding:12px 25px;
    border:none;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

.yes{
    background:#ff7eb3;
    color:white;
}

.no{
    background:white;
    color:#333;
}

button:hover{
    transform:scale(1.08);
}

.message{
    display:none;
    margin-top:25px;
    animation:fade .8s;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.heart{
    position:absolute;
    animation:fall 8s linear infinite;
    font-size:22px;
}

@keyframes fall{
    from{
        transform:translateY(-100px);
    }
    to{
        transform:translateY(110vh);
    }
}
</style>

</head>

<body>

<div class="stars"></div>

<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>


<div class="container">

<h1>Sweeti 😊</h1>

<p>
তুমি কি আমার উপর একটু অভিমান করে আছো?
</p>

<button class="yes" onclick="showMessage()">হ্যাঁ</button>

<button class="no" onclick="showMessage()">না</button>


<div class="message" id="msg">

<p>
ধন্যবাদ Sweeti 😊<br><br>

আমি শুধু চেয়েছিলাম তুমি হাসো।<br>

তোমার পরীক্ষা আর সময়কে আমি সম্মান করি।<br>

কোনো চাপ নেই, শুধু ভালো থেকো ❤️<br><br>

— Mahin
</p>

</div>

</div>


<script>

let music=document.getElementById("music");

document.body.addEventListener("click",()=>{
    music.play();
},{once:true});


function showMessage(){

document.getElementById("msg").style.display="block";

createHearts();

}


function createHearts(){

for(let i=0;i<20;i++){

let heart=document.createElement("div");

heart.className="heart";
heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"%";
heart.style.animationDuration=(3+Math.random()*5)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},8000);

}

}

</script>

</body>
</html>
