<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sweeti ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
}

.container{
    width:90%;
    max-width:400px;
    padding:30px;
    text-align:center;
    border-radius:25px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    box-shadow:0 20px 40px rgba(0,0,0,.2);
    color:white;
    animation:show 1.5s ease;
}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(50px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}


.teddy{
    font-size:80px;
    animation:float 3s infinite ease-in-out;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-15px);
    }
}

h1{
    margin:15px 0;
    font-size:28px;
}

.message{
    min-height:80px;
    font-size:18px;
    line-height:1.6;
}

.buttons{
    margin-top:25px;
}

button{
    padding:12px 25px;
    margin:8px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-size:16px;
    transition:.3s;
}

.yes{
    background:#ff6b81;
    color:white;
}

.no{
    background:white;
    color:#764ba2;
}

button:hover{
    transform:scale(1.1);
}


.heart{
    position:absolute;
    color:#fff;
    animation:fall linear infinite;
}

@keyframes fall{
    from{
        transform:translateY(-100px);
    }
    to{
        transform:translateY(110vh);
    }
}

.footer{
    margin-top:20px;
    font-size:14px;
}
</style>
</head>

<body>


<div class="container">

<div class="teddy">🧸</div>

<h1>Sweeti 🌸</h1>

<div class="message" id="text"></div>


<div class="buttons">

<button class="yes" onclick="replyYes()">
হ্যাঁ 😊
</button>

<button class="no" onclick="replyNo()">
না 🙂
</button>

</div>


<div class="footer">
— Mahin
</div>

</div>


<script>

let msg =
"Sweeti, তুমি কি আমার উপর একটু অভিমান করে আছো? 🥺<br><br>আমি জানি তোমার পরীক্ষা চলছে। তোমার পড়াশোনা এবং সময়কে আমি সম্মান করি। শুধু জানতে চেয়েছিলাম তুমি ভালো আছো কিনা। ❤️";


let i=0;

function typing(){

if(i < msg.length){

document.getElementById("text").innerHTML =
msg.substring(0,i);

i++;

setTimeout(typing,40);

}

}

typing();



function replyYes(){

document.getElementById("text").innerHTML =
"আমি বুঝতে পারছি। 😊<br><br>তোমার মন ভালো করার চেষ্টা করবো। পরীক্ষার জন্য শুভকামনা রইলো। 🌸";

}


function replyNo(){

document.getElementById("text").innerHTML =
"ভালো লাগলো শুনে। 😊<br><br>মন দিয়ে পড়াশোনা করো। নিজের যত্ন নিও। 🌼";

}


// floating hearts

setInterval(()=>{

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤";

heart.style.left=Math.random()*100+"%";

heart.style.animationDuration=
(3+Math.random()*5)+"s";

heart.style.fontSize=
(15+Math.random()*25)+"px";

document.body.appendChild(heart);


setTimeout(()=>{
heart.remove();
},8000);


},500);


</script>


</body>
</html>
