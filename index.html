<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Love Me?</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffe6e6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
        }

        /* Feel free to replace this placeholder GIF url with your own asset link */
        .gif-container img {
            width: 200px;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            color: #d93838;
            font-size: 2.5rem;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 30px;
            position: relative;
            height: 50px;
        }

        button {
            padding: 12px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
        }

        #yesBtn:hover {
            background-color: #ff758f;
            transform: scale(1.1);
        }

        #noBtn {
            background-color: #707070;
            color: white;
            position: absolute;
            left: 55%; /* Initial offset placement */
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="gif-container">
            <!-- Replace source URL with your specific Peach/Goma or Panda animation asset -->
            <img id="statusGif" src="https://tenor.com" alt="Cute Bear Panda">
        </div>
        <h1 id="questionText">Do you love me?</h1>
        
        <div class="btn-group">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const questionText = document.getElementById('questionText');
        const statusGif = document.getElementById('statusGif');

        // Action when the Yes button is clicked
        yesBtn.addEventListener('click', () => {
            questionText.innerText = "I knew it! ❤️";
            // Optionally update image source here to a celebratory animation
            noBtn.style.display = 'none'; 
        });

        // Function that jumps the 'No' button away on desktop hover or mobile touch
        function moveNoButton() {
            // Get viewport constraints to keep the button fully visible inside screen borders
            const padding = 100;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            // Generate fully randomized viewport positions
            const randomX = Math.floor(Math.random() * (maxX + 1));
            const randomY = Math.floor(Math.random() * (maxY + 1));

            // Override original structural positioning to screen absolute alignment
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // Trigger evasion loop logic for both computer mouse and tactile touchscreens
        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevents phantom clicks or mobile zooming behavior
            moveNoButton();
        });
    </script>
</body>
</html>
